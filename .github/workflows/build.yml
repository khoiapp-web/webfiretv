name: Build Fire TV APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The GitHub runner already has the Android SDK installed (ANDROID_HOME is set).

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk maxihop-firetv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: maxihop-firetv-apk
          path: maxihop-firetv.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MaxiHop Fire TV build ${{ github.run_number }}
          files: maxihop-firetv.apk
          make_latest: true
